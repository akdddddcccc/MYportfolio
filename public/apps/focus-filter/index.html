<!doctype html>
<html lang="zh-CN"><head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>聚焦效果 · 离线照片滤镜</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: #262724; font: 400 16px/1.5 system-ui, "Microsoft YaHei", sans-serif; }
    main { max-width: 1440px; margin: auto; padding: clamp(20px,4vw,60px); }
    header { margin-bottom: 26px; }
    header p { margin: 0 0 8px; font: 12px/1.5 ui-monospace,Consolas,monospace; letter-spacing: .1em; color: #62645d; }
    h1 { margin: 0; font-size: clamp(1.9rem,4vw,3.25rem); line-height: 1.15; font-weight: 600; }
    footer { margin-top: 28px; font-size: .82rem; color: #62645d; }
    #offline { padding: 0; border: 0; background: none; color: inherit; font: inherit; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
    #offline:disabled { cursor: wait; }
  </style>
</head><body><main>
  <header><p>PHOTO STUDY / 01</p><h1>聚焦效果 · 离线照片滤镜</h1></header>
  <div id="tool"></div>
  <noscript>请开启 JavaScript 以使用照片滤镜。 Enable JavaScript to use the photo filter.</noscript>
  <footer><button id="offline" type="button">保存离线版</button> <span role="status" id="offline-status"></span></footer>
</main>
<script type="module">
  import {mountFocusFilter} from './workbench.mjs';
  const lang=new URLSearchParams(location.search).get('lang')==='en'?'en':'zh';
  if(lang==='en') {
    document.documentElement.lang='en';
    document.querySelector('h1').textContent=document.title='Focus · Offline Photo Filter';
  }
  mountFocusFilter(document.getElementById('tool'),{lang});
  const button=document.getElementById('offline'), status=document.getElementById('offline-status'), en=lang==='en';
  if(en) button.textContent='Save offline copy';
  button.addEventListener('click',async()=>{
    button.disabled=true; status.textContent=en?'Preparing…':'正在打包…';
    try {
      const {downloadOffline}=await import('./offline.mjs');
      await downloadOffline(lang);
      status.textContent=en?'Open the saved HTML file without a connection.':'下载后双击 HTML 文件即可断网使用。';
    } catch {
      status.textContent=en?'Could not load the tool files. Reconnect and try again.':'未能读取工具资源，请联网后重试。';
    } finally { button.disabled=false; }
  });
</script>
</body></html>
